global:
  scrape_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "api"
    metrics_path: "/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:3000"

  - job_name: "worker"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "host.docker.internal:3002"
